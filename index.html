<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sortino + Omega + PSR + Ulcer [Wall Street Pro]</title>
<style>
:root{--bg:#0f1115;--card:#171a21;--bd:#2a2f3a;--tx:#e8eaf0;--mu:#8b93a5;--g:#3ddc84;--r:#ff5c5c;--y:#ffd54a;--a:#4dd0e1}
@media (prefers-color-scheme: light){:root{--bg:#f4f5f8;--card:#fff;--bd:#d9dce4;--tx:#1a1d24;--mu:#606878;--g:#0a8f4a;--r:#d32f2f;--y:#b58900;--a:#00838f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,system-ui,Segoe UI,Roboto,sans-serif;padding:12px;max-width:900px;margin:auto}
h1{font-size:17px;margin:4px 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:8px}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mu);flex:1 1 130px}
input,button{font:inherit;padding:8px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);width:100%}
button{background:var(--a);color:#000;border:0;font-weight:600;cursor:pointer;align-self:flex-end;flex:1 1 130px}
.chk{flex-direction:row;align-items:center;gap:6px;color:var(--tx)}.chk input{width:auto}
#grade{font-size:20px;font-weight:700;padding:12px;border-radius:10px;text-align:center;margin-bottom:10px}
table{width:100%;border-collapse:collapse}
td{padding:7px 4px;border-bottom:1px solid var(--bd)}
td:last-child{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.g{color:var(--g)}.r{color:var(--r)}.y{color:var(--y)}.m{color:var(--mu)}
canvas{width:100%;height:260px;display:block}
#st{font-size:12px;color:var(--mu);margin-top:6px}
.w{overflow-x:auto}
.gauge{position:relative;height:14px;border-radius:7px;margin:34px 6px 8px;background:linear-gradient(90deg,var(--r) 0%,var(--r) 30%,var(--y) 40%,var(--y) 60%,var(--g) 70%,var(--g) 100%);opacity:.9}
.gauge .mid{position:absolute;left:50%;top:-4px;bottom:-4px;width:2px;background:var(--tx);opacity:.6}
.turtle{position:absolute;top:-30px;font-size:28px;line-height:1;transform:translateX(-50%);transition:left .6s ease;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}
.gl{display:flex;justify-content:space-between;font-size:12px;font-weight:700;margin:0 6px}
#zone{text-align:center;font-size:18px;font-weight:700;margin-top:8px}
#parts{font-size:12px;color:var(--mu);text-align:center;margin-top:4px}
</style>
</head>
<body>
<h1>Sortino + Omega + PSR + Ulcer [Wall Street Pro]</h1>

<div class="card">
  <div class="row">
    <label>Worker Yahoo
      <input id="worker" value="https://yahooproxy.b864v27974.workers.dev">
    </label>
  </div>
  <div class="row" style="margin-top:8px">
    <label>Dati<select id="mode" style="font:inherit;padding:8px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)"><option value="d">Giornalieri</option><option value="i">Da ore 9:00 (1 min)</option></select></label>
    <label>Simbolo<input id="sym" value="QQQ"></label>
    <label>Finestra (giorni)<input id="period" type="number" value="252" min="60"></label>
    <label>Risk-free annuo %<input id="rf" type="number" value="4.5" step="0.1"></label>
    <label>MAR annuo %<input id="mar" type="number" value="0" step="0.1"></label>
    <label>Storico<input id="range" value="5y"></label>
    <label class="chk"><input id="log" type="checkbox" checked> Rendimenti log</label>
    <button id="go">Calcola</button>
  </div>
  <div id="st"></div>
</div>

<div id="out" style="display:none">
  <div class="card">
    <div class="gl"><span class="r">◀ SHORT</span><span class="m">neutra</span><span class="g">LONG ▶</span></div>
    <div class="gauge"><div class="mid"></div><div class="turtle" id="turtle">🐢</div></div>
    <div id="zone"></div>
    <div id="parts"></div>
  </div>
  <div class="card">
    <div id="grade"></div>
    <table id="tbl"></table>
  </div>
  <div class="card">
    <div class="m" style="font-size:12px;margin-bottom:4px">Drawdown % rispetto al massimo della finestra (sfondo = rating storico)</div>
    <div class="w"><canvas id="cv"></canvas></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const store = { get:k=>{try{return localStorage.getItem(k)}catch(e){return null}}, set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}} };
$('worker').value = store.get('wk_worker') || 'https://yahooproxy.b864v27974.workers.dev';
$('sym').value = store.get('wk_sym') || 'QQQ';

const fmt = (v,d=2) => (v==null||!isFinite(v)) ? 'n/d' : v.toFixed(d);
const col = (v,hi,lo) => v==null ? 'm' : v>hi ? 'g' : v<lo ? 'r' : 'y';

// CDF normale (Abramowitz & Stegun 7.1.26), identica allo script Pine
function normCDF(x){
  const a1=0.254829592,a2=-0.284496736,a3=1.421413741,a4=-1.453152027,a5=1.061405429,p=0.3275911;
  const sign = x<0 ? -1 : 1, xa = Math.abs(x)/Math.SQRT2, t = 1/(1+p*xa);
  const y = 1 - (((((a5*t+a4)*t)+a3)*t+a2)*t+a1)*t*Math.exp(-xa*xa);
  return 0.5*(1+sign*y);
}

// media mobile "stile Pine": null se nella finestra c'e' un valore mancante
function sma(a,p){
  const o = new Array(a.length).fill(null);
  for(let i=p-1;i<a.length;i++){
    let s=0,ok=true;
    for(let j=i-p+1;j<=i;j++){ if(a[j]==null){ok=false;break} s+=a[j]; }
    if(ok) o[i]=s/p;
  }
  return o;
}
function stdev(a,m,p){ // popolazione, come ta.stdev
  const o = new Array(a.length).fill(null);
  for(let i=p-1;i<a.length;i++){
    if(m[i]==null) continue;
    let s=0;
    for(let j=i-p+1;j<=i;j++) s+=(a[j]-m[i])**2;
    o[i]=Math.sqrt(s/p);
  }
  return o;
}

function compute(close, P, rfAnn, marAnn, useLog, ppy=ppy, fromStart=false){
  const n = close.length, rfDay = rfAnn/ppy, marDay = marAnn/ppy;
  const ret = close.map((c,i)=> i===0 ? null : (useLog ? Math.log(c/close[i-1]) : c/close[i-1]-1));
  const meanR = sma(ret,P), stdR = stdev(ret,meanR,P);
  const d2 = ret.map(r=> r==null?null:Math.min(r-marDay,0)**2);
  const gain = ret.map(r=> r==null?null:Math.max(r-marDay,0));
  const loss = ret.map(r=> r==null?null:Math.max(marDay-r,0));
  const dd2m = sma(d2,P), gm = sma(gain,P), lm = sma(loss,P);
  // skew/kurt come nello script: z con media/dev std della barra, poi sma(z^3), sma(z^4)
  const z3 = ret.map((r,i)=> (r==null||meanR[i]==null||!stdR[i])?null:((r-meanR[i])/stdR[i])**3);
  const z4 = ret.map((r,i)=> (r==null||meanR[i]==null||!stdR[i])?null:((r-meanR[i])/stdR[i])**4);
  const skewA = sma(z3,P), kurtA = sma(z4,P);
  const peak = new Array(n).fill(null), dd = new Array(n).fill(null);
  for(let i=(fromStart?0:P-1);i<n;i++){ let m=-Infinity; for(let j=(fromStart?0:i-P+1);j<=i;j++) if(close[j]>m) m=close[j]; peak[i]=m; dd[i]=(close[i]-m)/m*100; }
  const ddsq = dd.map(v=>v==null?null:v*v), ulcA = sma(ddsq,P).map(v=>v==null?null:Math.sqrt(v));

  const res = [];
  for(let i=0;i<n;i++){
    if(meanR[i]==null){ res.push(null); continue; }
    const m = meanR[i], s = stdR[i];
    const annRet = m*ppy, annVol = s*Math.sqrt(ppy);
    const sharpe = s>0 ? (m-rfDay)/s*Math.sqrt(ppy) : null;
    const dDev = dd2m[i]!=null ? Math.sqrt(dd2m[i]) : null;
    const sortino = dDev>0 ? (m-marDay)/dDev*Math.sqrt(ppy) : null;
    const omega = lm[i]>0 ? gm[i]/lm[i] : null;
    const sr = sharpe==null ? null : sharpe/Math.sqrt(ppy);
    const skew = skewA[i], kurt = kurtA[i];
    let psr = null;
    if(sr!=null && skew!=null && kurt!=null){
      const den = Math.sqrt(Math.max(1 - skew*sr + (kurt-1)/4*sr*sr, 1e-10));
      psr = normCDF(sr*Math.sqrt(P-1)/den);
    }
    const ulcer = ulcAt(ulcA,i);
    const martin = ulcer>0 ? (annRet-rfAnn)/ulcer*100 : null;
    let score = 0;
    if(sortino!=null) score += sortino>1.5?1:(sortino<0.5?-1:0);
    if(omega!=null)   score += omega>1.5?1:(omega<1.0?-1:0);
    if(psr!=null)     score += psr>0.95?1:(psr<0.5?-1:0);
    if(martin!=null)  score += martin>5?1:(martin<1?-1:0);
    res.push({annRet,annVol,sharpe,sortino,omega,psr,skew,kurt,ulcer,martin,score,dd:dd[i]});
  }
  return res;
}
function ulcAt(a,i){ return a[i]; }

function gradeOf(s){
  return s>=3 ? ['A 级:机构可投','A — investibile istituzionale','rgba(61,220,132,.30)','var(--g)']
       : s>=1 ? ['B 级:合格','B — accettabile','rgba(170,230,80,.25)','var(--g)']
       : s===0 ? ['C 级:平庸','C — mediocre','rgba(150,150,150,.20)','var(--mu)']
       : ['D 级:差/避免','D — scarso / da evitare','rgba(255,92,92,.30)','var(--r)'];
}

// Posizione tartaruga: ogni metrica va da -1 (soglia "negativa" del rating) a +1 (soglia "positiva"),
// con 0 a meta' strada; la posizione e' la media delle quattro (-100 = tutto a sinistra, +100 = tutto a destra)
function turtlePos(L){
  const m = (v,lo,hi) => v==null ? null : Math.max(-1,Math.min(1,(v-(lo+hi)/2)/((hi-lo)/2)));
  const parts = [['Sortino',m(L.sortino,0.5,1.5)],['Omega',m(L.omega,1.0,1.5)],['PSR',m(L.psr,0.5,0.95)],['Martin',m(L.martin,1,5)]];
  const ok = parts.filter(p=>p[1]!=null);
  if(!ok.length) return null;
  return {pos: ok.reduce((a,p)=>a+p[1],0)/ok.length*100, parts};
}
function drawTurtle(L){
  const t = turtlePos(L), tt = $('turtle');
  if(!t){ $('zone').textContent='Dati insufficienti'; $('parts').textContent=''; return; }
  tt.style.left = ((t.pos+100)/2)+'%';
  const z = t.pos<=-33 ? ['ZONA SHORT','r'] : t.pos>=33 ? ['ZONA LONG','g'] : ['ZONA NEUTRA','y'];
  $('zone').className = z[1];
  $('zone').textContent = z[0]+' ('+(t.pos>0?'+':'')+t.pos.toFixed(0)+')';
  $('parts').textContent = t.parts.map(p=>p[0]+' '+(p[1]==null?'n/d':(p[1]>0?'+':'')+(p[1]*100).toFixed(0))).join(' · ');
}

function render(sym, dates, close, res){
  const L = res[res.length-1];
  if(!L){ $('st').textContent='Dati insufficienti per la finestra scelta.'; return; }
  const g = gradeOf(L.score);
  const gd = $('grade'); gd.textContent = g[1]; gd.style.background = g[2]; gd.style.color = g[3];
  const rows = [
    ['Ultimo dato', dates[dates.length-1]+' · '+fmt(close[close.length-1]), 'm'],
    ['Rendimento annualizzato', fmt(L.annRet*100)+'%', L.annRet>0?'g':'r'],
    ['Volatilità annualizzata', fmt(L.annVol*100)+'%', 'm'],
    ['Sharpe (classico)', fmt(L.sharpe), L.sharpe>1?'g':'r'],
    ['Sortino (solo ribasso)', fmt(L.sortino), col(L.sortino,1.5,0.5)],
    ['Omega (intera distribuzione)', fmt(L.omega), col(L.omega,1.5,1)],
    ['PSR (prob. SR vero > 0)', L.psr==null?'n/d':fmt(L.psr*100,1)+'%', col(L.psr,0.95,0.5)],
    ['Asimmetria (Skew)', fmt(L.skew), L.skew>0?'g':'r'],
    ['Curtosi (Kurt)', fmt(L.kurt), L.kurt>5?'r':'m'],
    ['Ulcer Index', fmt(L.ulcer), L.ulcer>10?'r':'g'],
    ['Martin Ratio', fmt(L.martin), col(L.martin,5,1)],
    ['Punteggio (−4…+4)', String(L.score), g[3]==='var(--r)'?'r':'g']
  ];
  $('tbl').innerHTML = rows.map(r=>`<tr><td>${r[0]}</td><td class="${r[2]}">${r[1]}</td></tr>`).join('');
  $('out').style.display='block';
  drawTurtle(L);
  draw(res);
}

function draw(res){
  const cv = $('cv'), dpr = window.devicePixelRatio||1;
  const W = cv.clientWidth, H = cv.clientHeight;
  cv.width = W*dpr; cv.height = H*dpr;
  const c = cv.getContext('2d'); c.scale(dpr,dpr);
  const css = getComputedStyle(document.documentElement);
  const pts = res.map((r,i)=>r?{i,dd:r.dd,s:r.score}:null).filter(Boolean);
  if(!pts.length) return;
  const mn = Math.min(-25, Math.min(...pts.map(p=>p.dd))*1.05), mx = 2;
  const x = k => 36 + k/(pts.length-1||1)*(W-44), y = v => 8 + (mx-v)/(mx-mn)*(H-24);
  const bw = Math.max(1,(W-44)/pts.length+0.5);
  pts.forEach((p,k)=>{ c.fillStyle = gradeOf(p.s)[2]; c.fillRect(x(k),8,bw,H-24); });
  c.font='11px sans-serif'; c.textBaseline='middle';
  [[0,'0',css.getPropertyValue('--tx'),[6,4]],[-10,'-10%','#ff9800',[2,3]],[-20,'-20%','#ff5c5c',[2,3]]].forEach(([v,t,col,d])=>{
    if(v<mn) return;
    c.strokeStyle=col.trim(); c.setLineDash(d); c.beginPath(); c.moveTo(36,y(v)); c.lineTo(W-8,y(v)); c.stroke();
    c.setLineDash([]); c.fillStyle=css.getPropertyValue('--mu'); c.fillText(t,2,y(v));
  });
  c.strokeStyle='#ff5c5c'; c.lineWidth=2; c.beginPath();
  pts.forEach((p,k)=>{ k?c.lineTo(x(k),y(p.dd)):c.moveTo(x(k),y(p.dd)); }); c.stroke();
}

function workerUrl(base,sym,range,interval){
  return base + (base.includes('?')?'&':'?') + `symbol=${encodeURIComponent(sym)}&interval=${interval}&range=${encodeURIComponent(range)}`;
}

let last = null;
async function run(){
  const wk = $('worker').value.trim(), sym = $('sym').value.trim().toUpperCase();
  if(!wk){ $('st').textContent='Inserisci l\'URL del Worker Yahoo.'; return; }
  store.set('wk_worker',wk); store.set('wk_sym',sym);
  const P = Math.max(60, parseInt($('period').value)||252);
  $('st').textContent='Scarico dati…'; $('go').disabled = true;
  try{
    const intra = $('mode').value==='i';
    const r = await fetch(workerUrl(wk, sym, intra?'1d':($('range').value.trim()||'5y'), intra?'1m':'1d'));
    if(!r.ok) throw new Error('HTTP '+r.status);
    const j = await r.json();
    const res0 = j.chart && j.chart.result && j.chart.result[0];
    if(!res0) throw new Error((j.chart&&j.chart.error&&j.chart.error.description)||'risposta senza dati');
    const ts = res0.timestamp, cl = res0.indicators.quote[0].close;
    const gr = res0.meta && res0.meta.dataGranularity;
    if(gr && gr!==(intra?'1m':'1d')) throw new Error('il Worker ha restituito dati '+gr+' (simbolo '+res0.meta.symbol+') invece di '+(intra?'1 minuto':'giornalieri')+': i parametri symbol/interval/range non sono stati accettati');
    if(res0.meta && res0.meta.symbol && res0.meta.symbol.toUpperCase()!==sym) throw new Error('il Worker ha restituito '+res0.meta.symbol+' invece di '+sym);
    const tz = res0.meta && res0.meta.exchangeTimezoneName || 'America/New_York';
    const dates=[], close=[];
    if(intra){
      const rome = t => new Date(t*1000).toLocaleString('sv-SE',{timeZone:'Europe/Rome'}); // "YYYY-MM-DD HH:MM:SS"
      let day=null;
      ts.forEach((t,i)=>{ if(cl[i]!=null) day = rome(t).slice(0,10); });
      ts.forEach((t,i)=>{ if(cl[i]==null) return; const r = rome(t); if(r.slice(0,10)===day && r.slice(11,16)>='09:00'){ dates.push(r.slice(11,16)); close.push(cl[i]); } });
      if(close.length < 30) throw new Error(`solo ${close.length} barre dalle 9:00 ora italiana del ${day}: servono almeno 30`);
      const ppy = 252*960; // barre da 1 min/anno (04:00-20:00 ET, pre e after market inclusi)
      const out = compute(close, close.length-1, (parseFloat($('rf').value)||0)/100, (parseFloat($('mar').value)||0)/100, $('log').checked, ppy, true);
      const L = out[out.length-1];
      if(!L) throw new Error('dati insufficienti');
      let pk=-Infinity;
      for(let i=0;i<close.length;i++){ pk=Math.max(pk,close[i]); if(i<close.length-1) out[i]={dd:(close[i]-pk)/pk*100,score:L.score}; }
      last = {dates,close,out};
      render(sym,dates,close,out);
      $('st').textContent = `${sym} · ${close.length} barre da 1 min · ${day} dalle ${dates[0]} alle ${dates[dates.length-1]} (ora italiana) · finestra = tutto il periodo`;
      return;
    }
    ts.forEach((t,i)=>{ if(cl[i]!=null){ dates.push(new Date(t*1000).toLocaleDateString('sv-SE',{timeZone:tz})); close.push(cl[i]); } });
    if(close.length < P+5) throw new Error(`solo ${close.length} barre: servono più di ${P+1} (aumenta Storico)`);
    const out = compute(close, P, (parseFloat($('rf').value)||0)/100, (parseFloat($('mar').value)||0)/100, $('log').checked);
    last = {dates,close,out};
    render(sym,dates,close,out);
    $('st').textContent = `${sym} · ${close.length} barre giornaliere · ultimo dato ${dates[dates.length-1]} (${tz})`;
  }catch(e){
    $('st').textContent = 'Errore: '+e.message;
  }finally{ $('go').disabled=false; }
}
$('go').onclick = run;
window.addEventListener('resize',()=>{ if(last) draw(last.out); });
if($('worker').value) run();
</script>
</body>
</html>
